<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}

img{user-select:none}

#fx{position:fixed;inset:0;z-index:-2}
.bg{position:fixed;inset:0;z-index:-1;background:

  radial-gradient(860px 520px at 90% 6%,rgba(167,139,255,.18),transparent 55%),
  radial-gradient(720px 500px at 50% 116%,rgba(94,224,255,.14),transparent 55%),#05070f}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.045) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at 50% 0%,#000 22%,transparent 70%)}
/* 鼠标跟随光斑 */
#spot{position:fixed;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(91,141,239,.14),rgba(94,224,255,.07) 45%,transparent 65%);pointer-events:none;z-index:0;transform:translate(-50%,-50%);transition:transform .12s ease-out;filter:blur(10px)}

.scan{position:fixed;left:0;right:0;height:2px;z-index:1;background:linear-gradient(90deg,transparent,rgba(94,224,255,.35),transparent);pointer-events:none;animation:scan 7s linear infinite}

header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(5,7,15,.6);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}
.logo .mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(91,141,239,.55)}
.logo .mark svg{width:22px;height:22px}
header .spacer{flex:1}
.lang-wrap{position:relative}
select{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 15px;font-size:14px;cursor:pointer;max-width:240px;transition:.2s}

.lang-wrap::after{content:"▾";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}

.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.92);backdrop-filter:blur(14px);animation:fadeIn .25s}

</style>

const $ = id => document.getElementById(id);
const ICONS = ['📸','🎬','🔍','🌐','✂️','🏷️','🎞️','🗂️'];
let curShots = [], curName = '';

function buildOptions(){
  const sel = $('langSelect');
  sel.innerHTML = DATA.map(d=>`<option value="${d.loc}">${d.native} · ${d.loc}</option>`).join('');
  sel.onchange = ()=> apply(sel.value);
}

function apply(loc){
  const d = DATA.find(x=>x.loc===loc) || DATA.find(x=>x.loc==='en-US');
  curName = d.name; curShots = d.shots;
  document.documentElement.lang = loc;
  document.title = d.name + ' — AI Snapshot';
  document.querySelector('meta[name="description"]').content = (d.promo||d.desc).slice(0,160);
  document.querySelector('meta[name="keywords"]').content = d.keywords || '';
  // JSON-LD 更新
  const ld = JSON.parse($('jsonld').textContent);
  ld.name = d.name; ld.url = d.url; ld.description = (d.promo||d.desc).slice(0,200);
  $('jsonld').textContent = JSON.stringify(ld);
  $('appName').textContent = d.name;
  $('appSubtitle').textContent = d.subtitle;
  $('heroBadge').textContent = d.loc.toUpperCase();
  $('promoImg').src = d.promoUrl; $('promoImg').alt = d.name;
  ['dlTop','dlHero','dlCta'].forEach(id=>{ $(id).href = d.url; });
  const kws = (d.keywords||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,6);
  $('chips').innerHTML = kws.map((k,i)=>`<span class="chip">${ICONS[i%ICONS.length]} ${k}</span>`).join('');
  $('features').innerHTML = kws.map((k,i)=>`<div class="feature reveal"><div class="ico">${ICONS[i%ICONS.length]}</div><b>${k}</b></div>`).join('');
  const g = $('gallery');
  g.innerHTML = d.shots.map((s,i)=>`<figure class="reveal" data-idx="${i}"><img src="${s}" loading="lazy" alt="${d.name} ${i+1}"><figcaption>${d.name} · ${i+1}</figcaption></figure>`).join('');
  g.querySelectorAll('figure').forEach(f=>f.addEventListener('click',()=>openLB(+f.dataset.idx)));
  $('galleryTitle').textContent = d.subtitle;
  $('galleryLead').textContent = (d.desc.split('\n')[0]||'').slice(0,140);
  $('featTitle').textContent = d.promo;
  $('ctaTitle').textContent = d.name;
  $('ctaText').textContent = d.subtitle;
  $('footNote').textContent = d.promo;
  $('langSelect').value = loc;
  observeReveal();
}

let lbIdx = 0;
function openLB(i){ lbIdx = i; showLB(); }
function showLB(){
  $('lbImg').src = curShots[lbIdx];
  $('lbCaption').textContent = curName + ' · ' + (lbIdx+1);
  $('lbCount').textContent = (lbIdx+1) + ' / ' + curShots.length;
  $('lightbox').classList.add('open');
}
function closeLB(){ $('lightbox').classList.remove('open'); }
function stepLB(d){ lbIdx = (lbIdx + d + curShots.length) % curShots.length; showLB(); }
$('lbClose').onclick = closeLB;
$('lbPrev').onclick = ()=>stepLB(-1);
$('lbNext').onclick = ()=>stepLB(1);
$('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLB(); });
document.addEventListener('keydown',e=>{
  if(!$('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLB();
  if(e.key==='ArrowLeft') stepLB(-1);
  if(e.key==='ArrowRight') stepLB(1);
});
document.addEventListener('DOMContentLoaded',()=>{ $('promoImg').addEventListener('click',()=>{ lbIdx=0; showLB(); }); });

function detectLang(){
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  for (const raw of list){
    if(!raw) continue;
    const l = raw.toLowerCase().replace('_','-');
    const exact = DATA.find(d=>d.loc.toLowerCase()===l);
    if(exact) return exact.loc;
    if(l.startsWith('zh')) return (l.includes('tw')||l.includes('hk')||l.includes('mo')||l.includes('hant')) ? 'zh-Hant' : 'zh-Hans';
    const base = l.split('-')[0];
    if(base==='en'){ const hit = DATA.find(d=>d.loc==='en-'+l.slice(3).toUpperCase()); if(hit) return hit.loc; }
    const byBase = DATA.find(d=>d.loc.split('-')[0]===base);
    if(byBase) return byBase.loc;
  }
  return 'en-US';
}

let revealObs;
function observeReveal(){
  if(revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver((es)=>{ es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target);} }); },{threshold:.1});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>revealObs.observe(el));
}

/* 粒子背景 */
(function(){
  const cv=document.getElementById('fx'),ctx=cv.getContext('2d');let W,H,pts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}resize();addEventListener('resize',resize);
  const N=Math.min(70,Math.floor(innerWidth/20));
  for(let i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.4,c:Math.random()<.5?'91,141,239':'94,224,255'});
  function tick(){ctx.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(${p.c},.5)`;ctx.fill();}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<12000){ctx.strokeStyle=`rgba(120,160,255,${.12*(1-d/12000)})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    requestAnimationFrame(tick);}
  tick();
})();

/* 鼠标跟随光斑 */
(function(){
  const s=document.getElementById('spot');
  document.addEventListener('mousemove',e=>{ s.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`; });
})();

/* 3D tilt */
(function(){const w=document.querySelector('.promo-wrap');if(!w)return;const i=w.querySelector('.promo-img');
  w.addEventListener('mousemove',e=>{const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.transform=`rotateY(${x*7}deg) rotateX(${-y*7}deg) scale(1.02)`;});
  w.addEventListener('mouseleave',()=>{i.style.transform='';});})();

buildOptions();
const q=new URLSearchParams(location.search).get('lang');
const init=(q&&DATA.some(d=>d.loc===q))?q:detectLang();
apply(init);
</script>
